name: garden
description: "A habit tracker where each habit grows a flower: streaks that forgive, charts, CSV export and backup, no accounts."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  shared_preferences: ^2.5.6
  flutter_local_notifications: ^23.0.0
  timezone: ^0.11.2
  sqflite: ^2.4.6
  path: ^1.9.1
  share_plus: ^13.3.1
  path_provider: ^2.1.6
  file_picker: ^13.3.3
  home_widget: ^0.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.7

flutter:
  uses-material-design: true

  assets:
    - assets/plants/

  # Newsreader (SIL Open Font Licence, see assets/fonts/OFL.txt): the serif
  # for headlines, so they look the same on every phone.
  fonts:
    - family: Newsreader
      fonts:
        - asset: assets/fonts/Newsreader.ttf
