name: garden
description: "A habit tracker where each habit is a flower you water in a watercolour meadow."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  shared_preferences: ^2.5.6
  flutter_local_notifications: ^23.0.0
  timezone: ^0.11.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/art/placeholder/

  # Newsreader (SIL Open Font Licence, see assets/fonts/OFL.txt): the serif
  # for headlines, so they look the same on every phone.
  fonts:
    - family: Newsreader
      fonts:
        - asset: assets/fonts/Newsreader.ttf
